# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=16"
MAKEOPTS="-j16"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
USE="-wayland -screencast -systemd npm xinerama udev gtk mailutils gui qt6 kdrive xephyr cuda openvdb openvdb-compression jemalloc bluetooth acl man git nvidia acl X udisks policykit dbus elogind dist-kernel alsa"
#GPU: AMD Radeon RX 9060 XT [Discrete]
VIDEO_CARDS="amdgpu radeonsi" 
# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

# Mirrors chosen for proximity and reliability (Waterloo first, then US university mirrors)

GENTOO_MIRRORS="
https://mirror.csclub.uwaterloo.ca/gentoo-distfiles/ \
https://mirror.clarkson.edu/gentoo/ \
https://mirrors.kernel.org/gentoo/ \
https://mirrors.mit.edu/gentoo-distfiles/ \
https://mirror.cs.odu.edu/ \
https://gentoo.osuosl.org/ \
https://mirror.planetunix.net/pub/gentoo/ \
https://mirrors.rit.edu/gentoo/ \
https://mirror.servaxnet.com/gentoo/ \
https://mirror.umd.edu/gentoo/"
GRUB_PLATFORM="efi-64"
